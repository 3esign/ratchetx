[package]
name = "rcx-timepin-v2"
version = "0.1.0"
description = "No-value Timepin v2 evidence-spec and canonical-Need primitive"
edition = "2021"
publish = false

[package.metadata.solana]
tools-version = "v1.56"

[lib]
crate-type = ["cdylib", "lib"]
name = "rcx_timepin_v2"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
pyth-solana-receiver-sdk = { version = "=2.0.0", features = ["pro-compatible"] }
solana-sha256-hasher = "=3.1.0"
