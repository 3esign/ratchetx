[package]
name = "rcx-timepin-v2-svm-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Independent transaction tests for Timepin v2 register/open SBF"

[workspace]

[dependencies]
litesvm = "=0.16.0"
