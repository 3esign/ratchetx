[package]
name = "ratchet-core-g2"
version = "0.1.0"
description = "Operator-independent RatchetX economic kernel consuming immutable Timepin evidence"
edition = "2021"
publish = false

[package.metadata.solana]
tools-version = "v1.56"

[lib]
crate-type = ["cdylib", "lib"]
name = "ratchet_core_g2"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", features = ["memo"] }
solana-sha256-hasher = "=3.1.0"
spl-token-2022-interface = "=2.1.0"
spl-token-metadata-interface = "=0.8.0"
