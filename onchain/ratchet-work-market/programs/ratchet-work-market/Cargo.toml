[package]
name = "ratchet-work-market"
version = "0.1.0"
description = "Demand-bound RCX execution vouchers with no operator purse"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ratchet_work_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2" }
anchor-spl = { version = "=1.0.2" }
solana-sha256-hasher = "=3.1.0"
