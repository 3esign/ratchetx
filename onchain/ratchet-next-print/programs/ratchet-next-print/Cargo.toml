[package]
name = "ratchet-next-print"
version = "0.1.0"
description = "RatchetX server-free direct-successor Pyth game prototype"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ratchet_next_print"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
pyth-solana-receiver-sdk = { version = "=2.0.0", features = ["pro-compatible"] }
solana-sha256-hasher = "=3.1.0"
