# Fresh Core G2 + Timepin v2 evidence; no deployment or live-oracle claim.
name: g2-build
on:
  push:
    paths:
      - onchain/ratchet-core-g2/**
      - onchain/rcx-timepin-v2/**
      - onchain/rcx-timepin/model-v2.mjs
      - tools/g2-build-artifacts.mjs
      - tools/verify-artifact.mjs
      - tools/repin-timepin-vectors.mjs
      - package.json
      - package-lock.json
      - .github/workflows/g2-build.yml
  pull_request:
    paths:
      - onchain/ratchet-core-g2/**
      - onchain/rcx-timepin-v2/**
      - onchain/rcx-timepin/model-v2.mjs
      - tools/g2-build-artifacts.mjs
      - tools/verify-artifact.mjs
      - tools/repin-timepin-vectors.mjs
      - package.json
      - package-lock.json
      - .github/workflows/g2-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned SBF builder
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-build-sbf --version 4.3.0 --locked
          cargo-build-sbf --version
          rustc --version
      - name: Timepin v2 host tests
        working-directory: onchain/rcx-timepin-v2
        run: cargo test --locked --lib
      - name: Core G2 host tests
        working-directory: onchain/ratchet-core-g2
        run: cargo test --locked --lib
      - name: Build SBPFv3, verify vectors, and run both exact-SBF matrices
        id: g2
        run: |
          rm -f -- docs/receipts/g2-build-artifacts.json
          node tools/g2-build-artifacts.mjs --ci \
            --timepin-id C8wwxUGmoKAV22MaY3oW2Q6QeDbmB9dbNdbohsRjJkYp \
            --core-id cGfHiC6Kgg3FpFZvgwGcswsCRtp4aBP2fzuXRQPizuN
      # The helper pins platform-tools v1.56 and copies ONLY verified .so files
      # into this content-addressed cache. Raw output can contain keypairs.
      - name: Preserve candidate bytes and receipt, including a failed run
        if: always() && (steps.g2.outcome == 'success' || steps.g2.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: g2-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ratchetx-onchain-sbf/*/rcx_timepin_v2.so
            ${{ runner.temp }}/ratchetx-onchain-sbf/*/ratchet_core_g2.so
            docs/receipts/g2-build-artifacts.json
          if-no-files-found: error
