# Both platforms run the portable suite. Windows also executes the real
# DEPLOY.cmd exit-code check. Browser fixtures start automatically; any skipped
# case fails its gate. Both matrix jobs must pass before release.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Linux browser tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: Install Chrome for Windows browser tests
        if: runner.os == 'Windows'
        run: npx playwright install chrome
      - run: npm test
