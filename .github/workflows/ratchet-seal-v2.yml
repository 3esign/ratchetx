name: Ratchet Seal v2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ratchet-seal-v2
    paths:
      - onchain/ratchet-seal-v2/**
      - .github/workflows/ratchet-seal-v2.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run focused host tests
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/work" -w /work/onchain/ratchet-seal-v2 solanafoundation/anchor:v1.0.2 cargo test --workspace > cargo-test.log 2>&1
          code=$?
          cat cargo-test.log
          if [ "$code" -ne 0 ]; then
            encoded=$(tail -c 12000 cargo-test.log | base64 -w0)
            echo "::error title=Rust compiler log base64::$encoded"
          fi
          exit "$code"
      - name: Build with the pinned Anchor toolchain
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/onchain/ratchet-seal-v2 \
            solanafoundation/anchor:v1.0.2 \
            anchor build
      - name: Report deploy size and digest
        run: |
          ls -lh onchain/ratchet-seal-v2/target/deploy/*.so
          sha256sum onchain/ratchet-seal-v2/target/deploy/*.so
      - uses: actions/upload-artifact@v4
        with:
          name: ratchet-seal-v2-build
          path: |
            onchain/ratchet-seal-v2/target/deploy/*.so
            onchain/ratchet-seal-v2/target/idl/*.json
          if-no-files-found: error
