name: Ratchet Seal v2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ratchet-seal-v2
    paths:
      - onchain/ratchet-seal-v2/**
      - .github/workflows/ratchet-seal-v2.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run focused host tests
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/work" -w /work/onchain/ratchet-seal-v2 solanafoundation/anchor:v1.0.2 cargo test --workspace > cargo-test.log 2>&1
          code=$?
          cat cargo-test.log
          if [ "$code" -ne 0 ]; then
            encoded=$(tail -c 12000 cargo-test.log | base64 -w0)
            echo "::error title=Rust compiler log base64::$encoded"
          fi
          exit "$code"
      - name: Build with the pinned Anchor toolchain
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/onchain/ratchet-seal-v2 \
            solanafoundation/anchor:v1.0.2 \
            cargo build-sbf --manifest-path programs/ratchet-seal/Cargo.toml
      - name: Verify and normalize the Ratchet v2 program id
        shell: bash
        run: |
          expected="23k3r8AJRdX64iipwNMqPdN2vSgNmw9stGs7cJqmZEEX"
          grep -Fq "declare_id!(\"$expected\")" onchain/ratchet-seal-v2/programs/ratchet-seal/src/lib.rs
          grep -Fq "$expected" onchain/ratchet-seal-v2/Anchor.toml
          test "$(jq -r '.address' onchain/ratchet-seal-v2/idl/ratchet_seal.json)" = "$expected"
      - name: Report deploy size and digest
        shell: bash
        run: |
          so=$(find onchain/ratchet-seal-v2/target/deploy -maxdepth 1 -name '*.so' -print -quit)
          bytes=$(stat -c%s "$so")
          digest=$(sha256sum "$so" | cut -d' ' -f1)
          echo "::notice title=Ratchet Seal v2 binary::$bytes bytes · sha256 $digest"
          ls -lh "$so"
          sha256sum "$so"
      - uses: actions/upload-artifact@v4
        with:
          name: ratchet-seal-v2-build
          path: |
            onchain/ratchet-seal-v2/target/deploy/*.so
            onchain/ratchet-seal-v2/idl/*.json
            onchain/ratchet-seal-v2/Cargo.lock
          if-no-files-found: error
