<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1500, initial-scale=1">
  <title>RATCHET DEXScreener Header</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1500px; height: 500px; margin: 0; overflow: hidden; }
    body { color: #f4f1e8; background: radial-gradient(circle at 17% 45%, rgba(222,168,58,.13), transparent 28%), radial-gradient(circle at 89% 15%, rgba(88,209,159,.08), transparent 25%), linear-gradient(115deg,#06080b 0%,#0b0e13 52%,#07090d 100%); font-family: Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .frame { position: relative; width: 100%; height: 100%; border: 1px solid rgba(218,170,66,.26); isolation: isolate; }
    .frame::before { content:""; position:absolute; inset:0; z-index:-2; opacity:.25; background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:42px 42px; mask-image:linear-gradient(90deg,#000,transparent 61%); }
    .frame::after { content:""; position:absolute; right:-72px; top:-210px; z-index:-1; width:730px; height:730px; border:1px solid rgba(218,170,66,.19); border-radius:50%; box-shadow:0 0 0 46px rgba(218,170,66,.025),0 0 0 98px rgba(218,170,66,.018),inset 0 0 90px rgba(218,170,66,.035); }
    .topline { position:absolute; top:34px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between; color:#9ba2ad; font:700 14px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.22em; text-transform:uppercase; }
    .live { color:#64d8a4; }
    .live::before { content:""; display:inline-block; width:7px; height:7px; margin:0 10px 1px 0; border-radius:50%; background:#64d8a4; box-shadow:0 0 16px rgba(100,216,164,.7); }
    .content { position:absolute; inset:87px 64px 84px; display:grid; grid-template-columns:232px 1fr; align-items:center; gap:48px; }
    .mark { width:214px; height:214px; padding:24px; display:grid; place-items:center; border:1px solid rgba(218,170,66,.28); border-radius:50%; background:radial-gradient(circle,rgba(218,170,66,.11),rgba(11,14,19,.72) 67%); box-shadow:0 18px 60px rgba(0,0,0,.38),inset 0 0 38px rgba(218,170,66,.05); }
    .mark img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 18px rgba(229,177,67,.15)); }
    h1 { margin:0; font:750 88px/.92 Georgia,"Times New Roman",serif; letter-spacing:.18em; text-transform:uppercase; text-shadow:0 12px 40px rgba(0,0,0,.55); }
    h1 span { color:#d9aa48; }
    .subtitle { margin-top:17px; color:#aeb4be; font:650 19px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.18em; text-transform:uppercase; }
    .rule { margin-top:31px; display:flex; gap:12px; flex-wrap:wrap; }
    .pill { padding:10px 15px 9px; border:1px solid rgba(218,170,66,.25); border-radius:999px; background:rgba(14,17,23,.78); color:#d6d9de; font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; }
    .pill strong { color:#e2b34f; }
    .footer { position:absolute; left:64px; right:64px; bottom:33px; padding-top:18px; display:flex; justify-content:space-between; border-top:1px solid rgba(218,170,66,.16); color:#7f8793; font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; }
    .footer b { color:#bfc4cc; }
  </style>
</head>
<body>
  <main class="frame">
    <div class="topline"><span>The Solana prediction machine</span><span class="top-right"><span class="live">Live on mainnet</span><span class="site">RATCHETX.XYZ</span></span></div>
    <section class="content">
      <div class="mark"><img src="./logo.png" alt="RATCHET"></div>
      <div>
        <h1>RATCHET<span>X</span></h1>
        <div class="subtitle">Sealed market calls · Pyth-settled outcomes</div>
        <div class="rule"><span class="pill"><strong>70%</strong> burned forever</span><span class="pill"><strong>30%</strong> live podium</span><span class="pill"><strong>0%</strong> team</span></div>
      </div>
    </section>
    <div class="footer"><span><b>$RCX</b> · Token-2022 · PumpSwap</span><span>RATCHETX.XYZ · Open source · Public proof</span></div>
  </main>
</body>
</html>
